<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"></head><body>
<title>Scopeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap">
<style>
/* One page: the landing view opens with a chat box; starting it turns the page into the chat workspace.
   Light mode only. Warm paper, near-black ink, four claim colours (evidence, assumption, question, decision). */
:root {
  --bg: #fbfaf7; --tint: #f4f1ea; --surface: #ffffff; --ink: #15130f; --muted: #625d55; --line: #e6e1d8;
  --ev: #11805a; --ev-bg: #e3f4ec; --ev-line: #a6dcc4;
  --as: #a35a00; --as-bg: #fdf0da; --as-line: #f0c98a;
  --qu: #3a4fc6; --qu-bg: #e9ecfd; --qu-line: #b9c2f5;
  --dc: #15130f; --dc-bg: #efede8; --dc-line: #cfcac0;
  --bad: #c2382c; --bad-bg: #fde6e3;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --hand: "Caveat", "Segoe Print", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 50; }
p { margin: 0; } h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--qu); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.serif { font-family: var(--serif); font-weight: 300; letter-spacing: -0.03em; line-height: 1; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Shared bits */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer; white-space: nowrap; transition: transform .15s; text-decoration: none; }
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 0.82rem; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.knob { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-right: -10px; border-radius: 50%; background: #3a3730; font-size: 1rem; }
.link { background: none; border: 0; padding: 2px 4px; color: var(--muted); font-size: 0.8rem; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.link:hover { color: var(--ink); }
.logo { display: inline-flex; align-items: center; gap: 9px; font-family: var(--serif); font-size: 1.4rem; letter-spacing: -0.02em; background: none; border: 0; cursor: pointer; padding: 0; color: var(--ink); }
.mark { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 22px; height: 22px; padding: 3px; border-radius: 7px; background: var(--ink); flex-shrink: 0; }
.mark i { border-radius: 2px; } .mark i:nth-child(1){background:#3ccf91} .mark i:nth-child(2){background:#f5b748} .mark i:nth-child(3){background:#7d8cff} .mark i:nth-child(4){background:#fff}
.tag { display: inline-block; font-family: var(--mono); font-size: 0.6rem; letter-spacing: .09em; text-transform: uppercase; border-radius: 5px; padding: 2px 7px; font-weight: 500; }
.t-ev { background: var(--ev-bg); color: var(--ev); } .t-as { background: var(--as-bg); color: var(--as); } .t-qu { background: var(--qu-bg); color: var(--qu); } .t-dc { background: var(--dc-bg); color: var(--dc); }
.callout { border-radius: 12px; border: 1px solid; padding: 10px 13px; font-size: 0.92rem; line-height: 1.45; }
.co-tag { display: block; font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 500; margin-bottom: 3px; }
.co-src { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.co-ev { background: var(--ev-bg); border-color: var(--ev-line); } .co-ev .co-tag { color: var(--ev); }
.co-as { background: var(--as-bg); border-color: var(--as-line); } .co-as .co-tag { color: var(--as); }
.co-qu { background: var(--qu-bg); border-color: var(--qu-line); } .co-qu .co-tag { color: var(--qu); }
.co-dc { background: var(--dc-bg); border-color: var(--dc-line); } .co-dc .co-tag { color: var(--dc); }
mark.bad { background: var(--bad-bg); color: var(--bad); border-radius: 4px; padding: 0 3px; }
.ph { font-family: var(--mono); font-size: 0.82em; border: 1px dashed var(--muted); border-radius: 6px; padding: 0 6px; color: var(--muted); }
.av { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-family: var(--mono); font-size: 0.56rem; font-weight: 500; color: #fff; flex-shrink: 0; }
.av-pm { background: #15130f; } .av-design { background: #d6457a; } .av-growth { background: #11805a; } .av-engineering { background: #3a4fc6; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 72px); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 0.88rem; z-index: 60; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
.field { position: relative; border-radius: 28px; overflow: hidden; padding: clamp(14px, 3.5vw, 48px); isolation: isolate; }
.field::before { content: ""; position: absolute; inset: -25%; z-index: -1; filter: blur(46px) saturate(1.2); background: radial-gradient(38% 55% at 10% 30%, #45d39b 0%, transparent 70%), radial-gradient(34% 50% at 42% 95%, #f7b84b 0%, transparent 70%), radial-gradient(42% 60% at 78% 18%, #8193ff 0%, transparent 70%), radial-gradient(38% 50% at 96% 88%, #ff8fa6 0%, transparent 70%), linear-gradient(120deg, #cff3df, #fde8c4 45%, #dfe3ff); animation: drift 22s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(4%, -3%, 0) rotate(4deg) scale(1.05); } }

/* ---------- Composer (same component on the landing page and in the chat) ---------- */
.composer { background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 24px 50px -32px rgba(20,20,40,.45); transition: border-color .2s, box-shadow .2s; }
.composer:focus-within { border-color: var(--ink); box-shadow: 0 24px 60px -28px rgba(20,20,40,.55); }
.composer textarea { width: 100%; border: 0; resize: none; background: transparent; font-size: 1.05rem; line-height: 1.5; min-height: 56px; max-height: 200px; outline: none; }
.composer-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 0.82rem; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--ink); background: var(--surface); }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
.send:disabled { opacity: .3; cursor: default; }

/* ---------- Landing view ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; padding-top: 12px; }
.bar { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.9); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 999px; padding: 8px 8px 8px 18px; box-shadow: 0 14px 34px -24px rgba(0,0,0,.35); }
.bar .spacer { flex: 1; }
.bar nav { display: flex; gap: 4px; }
.bar nav a { text-decoration: none; color: var(--muted); font-size: 0.9rem; padding: 6px 12px; border-radius: 999px; }
.bar nav a:hover { color: var(--ink); background: var(--tint); }
.hero { padding-block: 64px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px; }
.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--ev); animation: live 2s infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(17,128,90,.5); } 70% { box-shadow: 0 0 0 8px rgba(17,128,90,0); } 100% { box-shadow: 0 0 0 0 rgba(17,128,90,0); } }
.hero h1 { font-size: clamp(2.8rem, 7.4vw, 5.8rem); }
.hero h1 em { font-style: italic; color: var(--ev); }
.hero .lede { font-size: clamp(1.05rem, 1.5vw, 1.2rem); color: var(--muted); max-width: 34em; }
.start-box { width: min(760px, 100%); text-align: left; position: relative; }
.hand { position: absolute; right: -118px; top: 18px; font-family: var(--hand); font-size: 1.6rem; transform: rotate(8deg); display: flex; align-items: center; gap: 4px; pointer-events: none; }
.start-note { font-size: 0.85rem; color: var(--muted); }
.recent { width: min(760px, 100%); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--muted); }
.recent button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 0.85rem; }
.recent button:hover { border-color: var(--ink); }

.sec { padding-block: clamp(64px, 8vw, 104px); }
.sec.tint { background: var(--tint); }
.sec-head { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; margin-bottom: 40px; }
.sec-head h2 { font-size: clamp(2.1rem, 4.4vw, 3.5rem); max-width: 14em; }
.sec-head p { color: var(--muted); max-width: 34em; }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* Animated demo (what happens after Start) */
.demo { background: var(--surface); border-radius: 18px; box-shadow: 0 40px 80px -34px rgba(20,20,40,.5), 0 0 0 1px rgba(0,0,0,.05); overflow: hidden; max-width: 1060px; margin: 0 auto; }
.win-bar { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); background: #f8f6f2; }
.dots { display: inline-flex; gap: 7px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
.win-bar .t { font-size: 0.84rem; color: var(--muted); }
.win-bar .r { margin-left: auto; }
.demo-body { display: grid; grid-template-columns: 1fr 1fr; min-height: 470px; }
.demo-chat { padding: 18px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--line); background: #faf9f6; }
.demo-doc { padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.demo [data-t] { transition: opacity .45s ease, transform .45s ease; }
.demo.playing [data-t]:not(.in) { opacity: 0; transform: translateY(8px); }
.demo.playing [data-t].in { opacity: 1; transform: none; }

/* Feature moments: each opens the chat */
.moments { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.moment { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: transform .2s, box-shadow .2s; }
.moment:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -28px rgba(0,0,0,.4); }
.moment h3 { font-family: var(--serif); font-weight: 400; font-size: 1.45rem; letter-spacing: -0.015em; line-height: 1.1; }
.moment .art { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; min-height: 150px; }
.moment .try { align-self: flex-start; }
.mini-q { border: 1.5px solid var(--qu-line); border-radius: 12px; padding: 10px; font-size: 0.82rem; display: flex; flex-direction: column; gap: 6px; }
.mini-q span.o { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.mini-q span.o.on { background: var(--qu-bg); border-color: var(--qu); font-weight: 600; }
.mini-thread { display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; }
.mini-thread p { display: flex; gap: 8px; align-items: flex-start; }
.final { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
.final h2 { font-size: clamp(2.1rem, 4.4vw, 3.5rem); max-width: 13em; }
.foot { border-top: 1px solid var(--line); padding-block: 26px; font-size: 0.86rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- Chat workspace view ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
.app-bar { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.app-bar .title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stages { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.stages::-webkit-scrollbar { display: none; }
.stages span { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; background: var(--surface); }
.stages span.done { background: var(--ev-bg); color: var(--ev); border-color: var(--ev-line); }
.stages span.now { background: var(--ink); color: #fff; border-color: var(--ink); }
.mode { font-size: 0.72rem; font-family: var(--mono); color: var(--qu); background: var(--qu-bg); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.ws { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 0; min-height: calc(100vh - 70px); }
.thread-col { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.thread { flex: 1; padding: 24px clamp(8px, 3vw, 40px) 16px; display: flex; flex-direction: column; gap: 16px; max-width: 820px; width: 100%; margin: 0 auto; }
.m-user { align-self: flex-end; max-width: 80%; background: var(--qu-bg); border: 1px solid var(--qu-line); border-radius: 18px 18px 4px 18px; padding: 10px 14px; white-space: pre-wrap; }
.m-ai { display: flex; flex-direction: column; gap: 10px; max-width: 92%; }
.who { display: inline-flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); }
.who .mark { width: 18px; height: 18px; border-radius: 5px; padding: 2px; }
.m-ai .reply { white-space: pre-wrap; }
.qcard { border: 1.5px solid var(--qu-line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.qcard b { font-size: 0.95rem; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px 8px 34px; font-size: 0.88rem; cursor: pointer; position: relative; }
.opt::before { content: ""; position: absolute; left: 12px; top: 50%; width: 13px; height: 13px; margin-top: -6.5px; border-radius: 4px; border: 1.5px solid var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--qu); }
.opt.on { background: var(--qu-bg); border-color: var(--qu); font-weight: 600; } .opt.on::before { background: var(--qu); border-color: var(--qu); }
.opt:disabled:not(.on) { opacity: .5; cursor: default; }
.props { display: flex; flex-direction: column; gap: 8px; }
.props-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--muted); }
.pcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: start; border-radius: 14px; border: 1px solid; padding: 10px 12px; }
.pcard .txt { font-size: 0.92rem; }
.pcard .acts { display: flex; gap: 4px; align-items: center; }
.pcard .acts button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; cursor: pointer; }
.pcard .acts button.yes { background: var(--ink); color: #fff; border-color: var(--ink); }
.pcard .flag { grid-column: 1 / -1; font-size: 0.78rem; color: var(--bad); }
.pcard .why { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.pcard.done { opacity: .55; } .pcard.done .acts { font-size: 0.76rem; color: var(--muted); }
.pcard textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 0.9rem; }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
.thinking::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--qu); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
.err { color: var(--bad); font-size: 0.86rem; }
.dock { position: sticky; bottom: 0; padding: 12px clamp(8px, 3vw, 40px) calc(env(safe-area-inset-bottom, 0px) + 16px); background: linear-gradient(transparent, var(--bg) 30%); }
.dock .composer { max-width: 820px; margin: 0 auto; }

/* Definition panel */
.docpane { position: sticky; top: 0; height: calc(100vh - 70px); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); }
.doc-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.doc-top h2 { font-family: var(--serif); font-weight: 400; font-size: 1.55rem; letter-spacing: -0.015em; }
.ready { display: flex; flex-direction: column; gap: 6px; }
.meter { height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; } .meter span { display: block; height: 100%; background: var(--ev); transition: width .5s ease; }
.gapline { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); }
.dsec { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.dsec-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dsec-h h3 { font-size: 0.86rem; }
.st { font-family: var(--mono); font-size: 0.58rem; letter-spacing: .08em; text-transform: uppercase; border-radius: 5px; padding: 2px 6px; }
.st.empty { border: 1px dashed var(--muted); color: var(--muted); } .st.proposed { background: var(--as-bg); color: var(--as); } .st.agreed { background: var(--ev-bg); color: var(--ev); }
.agree { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; font-size: 0.72rem; padding: 2px 9px; cursor: pointer; }
.agree.on { background: var(--ev); color: #fff; border-color: var(--ev); }
.ditem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: start; font-size: 0.88rem; border-radius: 10px; padding: 7px 9px; border: 1px solid; }
.ditem .x { opacity: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; padding: 0 2px; }
.ditem:hover .x, .ditem .x:focus-visible { opacity: 1; }
.dempty { font-size: 0.82rem; color: var(--muted); }
.mobile-tabs { display: none; }


/* ---------- Landing v2: ChatPRD-like structure, our content ---------- */
.lp-hero { padding-block: 64px 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px; }
.lp-hero h1 { font-size: clamp(2.9rem, 7.6vw, 6rem); max-width: 11em; }
.lp-hero h1 em { font-style: italic; color: var(--ev); }
.lp-hero .lede { font-size: clamp(1.05rem, 1.5vw, 1.22rem); color: var(--muted); max-width: 34em; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
.btn.big { height: 54px; padding: 0 26px; font-size: 1rem; }
.btn.big .knob { width: 34px; height: 34px; margin-right: -14px; }
.fineprint { font-size: 0.86rem; color: var(--muted); }
.walk { margin-top: 48px; }
.chapters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 1060px; margin: 18px auto 0; }
.chapter { text-align: left; border: 0; background: rgba(255,255,255,.75); backdrop-filter: blur(6px); border-radius: 14px; padding: 10px 12px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.chapter b { font-size: 0.92rem; } .chapter span { font-size: 0.8rem; color: var(--muted); }
.chapter .bar2 { height: 3px; border-radius: 3px; background: rgba(0,0,0,.08); overflow: hidden; }
.chapter .bar2 i { display: block; height: 100%; width: 0; background: var(--ink); }
.chapter.on { background: #fff; box-shadow: 0 10px 24px -18px rgba(0,0,0,.5); }
.chapter.done .bar2 i { width: 100%; }
.chapter.on .bar2 i { animation: fillbar var(--dur, 5s) linear forwards; }
@keyframes fillbar { from { width: 0; } to { width: 100%; } }
.demo2 .demo-body { min-height: 500px; }

.glow-top::after { width: 900px; height: 680px; right: -220px; top: -160px; background: radial-gradient(circle at 60% 50%, #a9d4ff 0%, #d9ecff 45%, transparent 70%); animation: floatB 22s ease-in-out infinite alternate; }
.glow-top i { position: absolute; left: 50%; top: 380px; width: 1100px; height: 520px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(170,240,205,.55), transparent); filter: blur(40px); }
@keyframes floatA { to { transform: translate(120px, 60px) scale(1.08); } }
@keyframes floatB { to { transform: translate(-140px, 80px) scale(1.05); } }
.lp-hero, .walk { position: relative; z-index: 1; }

/* ---------- Problem / Solution (incident.io-style toggle) ---------- */
.ps { padding-block: clamp(72px, 9vw, 120px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }

.scatter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; text-align: left; }

.scard:nth-child(1) { transform: rotate(-2deg); } .scard:nth-child(2) { transform: rotate(1.5deg) translateY(16px); } .scard:nth-child(3) { transform: rotate(-1deg) translateY(-6px); } .scard:nth-child(4) { transform: rotate(2deg) translateY(10px); }
.scard .src { font-family: var(--mono); font-size: 0.66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.verdict { margin-top: 42px; display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--bad-bg); color: var(--bad); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 0.92rem; }
.tree { display: flex; flex-direction: column; align-items: center; }

.branches { position: relative; width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 44px; }
.branches::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: -22px; height: 22px; border: 1.5px solid #d9d2c4; border-bottom: 0; border-radius: 14px 14px 0 0; }
.branches::after { content: ""; position: absolute; left: 50%; top: -44px; height: 22px; border-left: 1.5px solid #d9d2c4; }
.bcard { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: left; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 14px 30px -24px rgba(0,0,0,.4); font-size: 0.86rem; opacity: 0; transform: translateY(10px); transition: all .5s ease; }

<div id="root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const root = document.getElementById("root");
// =================== Domain ===================
const ROLES = { pm: "PM", design: "Design", growth: "Growth", engineering: "Engineering" };
const SECTIONS = [
  ["problem", "Problem"], ["audience", "Audience"], ["outcome", "Intended outcome"], ["evidence", "Evidence"],
  ["assumption", "Assumptions"], ["question", "Open questions"], ["scope_in", "In scope"], ["scope_out", "Out of scope"],
  ["criterion", "Acceptance criteria"], ["measure", "Measures"], ["decision", "Decisions"], ["visual", "Visuals"],
];
const SEC_LABEL = Object.fromEntries(SECTIONS);
const KIND = {
  problem: ["Problem", "co-dc", "t-dc"], audience: ["Audience", "co-dc", "t-dc"], outcome: ["Outcome", "co-dc", "t-dc"],
  evidence: ["Evidence", "co-ev", "t-ev"], assumption: ["Assumption", "co-as", "t-as"], question: ["Open question", "co-qu", "t-qu"],
  scope_in: ["In scope", "co-dc", "t-dc"], scope_out: ["Out of scope", "co-dc", "t-dc"], criterion: ["Acceptance criterion", "co-dc", "t-dc"],
  measure: ["Measure", "co-dc", "t-dc"], decision: ["Decision", "co-dc", "t-dc"], visual: ["Visual", "co-vis", "t-dc"],
};
const STAGES = [["Context", ["problem", "evidence"]], ["Audience", ["audience", "outcome"]], ["Claims", ["assumption", "question"]], ["Scope", ["scope_in", "scope_out"]], ["Measures", ["measure"]], ["Review", ["decision"]]];
const filled = (s) => (s || "").trim().length > 0;
const items = (f, k) => f.doc.filter((x) => x.kind === k);
const secStatus = (f, k) => !items(f, k).length ? "empty" : (f.agreed[k] ? "agreed" : "proposed");
function gaps(f) {
  const g = [];
  for (const [k, label] of SECTIONS) if (!items(f, k).length && k !== "decision" && k !== "criterion" && k !== "visual") g.push({ text: `${label} is empty`, ask: k });
  items(f, "assumption").forEach((a) => { if (!a.owner) g.push({ text: `Assumption needs an owner and a test: “${a.text}”`, ask: "assumption" }); });
  items(f, "measure").forEach((m) => { if (!m.baseline) g.push({ text: `Baseline unknown for “${m.text}”`, ask: "measure" }); });
  items(f, "question").forEach((q) => { if (!q.answer) g.push({ text: `${ROLES[q.role] || "PM"} hasn't answered: “${q.text}”`, ask: "question" }); });
  return g;
}

// =================== Claim rules (guided mode and the number guard) ===================
const SOURCE_RE = /\b(according to|per the|source:|from the (survey|interviews?|tickets|data|analytics)|support tickets|interview notes|analytics shows?|data shows?)\b/i;
const DECISION_RE = /\b(we decided|we agreed|decision:|we will not|we won't|agreed to)\b/i;
const CAUSAL_RE = /\b(will|lift|boost|increase|reduce|cut|drive|improve|cause|lead to)\b/i;
const NUM_RE = /\d+(?:[.,]\d+)?\s?%?/g;
const sentences = (t) => t.split(/(?<=[.!?])\s+|\n+/).map((s) => s.trim().replace(/^[-•*]\s*/, "")).filter((s) => s.length > 2);
function classifySentence(s, pastedResearch) {
  if (s.endsWith("?")) return "question";
  if (DECISION_RE.test(s)) return "decision";
  if ((pastedResearch || SOURCE_RE.test(s)) && !CAUSAL_RE.test(s)) return "evidence";
  return "assumption";
}
function knownNumbers(f) {
  // Only numbers that appear inside evidence (something with a named source) count as sourced.
  const t = [...f.doc.filter((x) => x.kind === "evidence").map((x) => x.text), ...f.chat.flatMap((m) => (m.proposals || []).filter((p) => p.kind === "evidence").map((p) => p.text))].join(" ");
  return new Set((t.match(NUM_RE) || []).map((n) => n.replace(/\s/g, "")));
}
const unsourced = (f, text) => (String(text).match(NUM_RE) || []).map((n) => n.replace(/\s/g, "")).filter((n) => !knownNumbers(f).has(n));


// =================== Charts (drawn from the definition or your numbers, never invented) ===================
const SERIES_COL = ["#15130f", "#11805a", "#3a4fc6", "#a35a00"];
const BASIS = {
  user: ["From your numbers", "b-user"], placeholder: ["Placeholders · add numbers", "b-ph"],
  estimate: ["Unverified estimate · check before use", "b-est"], definition: ["From your definition", "b-user"],
};
const num = (v) => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Number(v);
const fmtN = (v) => Math.abs(v) >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : (Math.round(v * 10) / 10).toString();
const trunc = (t, n) => (t.length > n ? t.slice(0, n - 1) + "…" : t);
function chartSVG(v, W = 460, H = 220) {
  const t = v.type;
  if (t === "matrix") {
    const L = 70, T = 12, cw = (W - L - 10) / 3, ch = (H - T - 34) / 3;
    let g = `<rect x="${L}" y="${T}" width="${cw}" height="${ch}" fill="var(--as-bg)"/>`;
    for (let i = 0; i <= 3; i++) g += `<line x1="${L + i * cw}" y1="${T}" x2="${L + i * cw}" y2="${T + 3 * ch}" stroke="var(--line)"/><line x1="${L}" y1="${T + i * ch}" x2="${L + 3 * cw}" y2="${T + i * ch}" stroke="var(--line)"/>`;
    g += `<text x="${L + 6}" y="${T + ch - 6}" font-size="10" fill="var(--as)" font-weight="600">Test first</text>`;
    g += `<text x="${L + 1.5 * cw}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">Evidence →</text><text x="12" y="${T + 1.5 * ch}" font-size="10" fill="var(--muted)" transform="rotate(-90 12 ${T + 1.5 * ch})" text-anchor="middle">Impact →</text>`;
    (v.items || []).slice(0, 8).forEach((it, i) => {
      const ev = Math.min(3, Math.max(1, Number(it.evidence) || 1)), im = Math.min(3, Math.max(1, Number(it.impact) || 3));

      g += `<circle cx="${cx}" cy="${cy}" r="6" fill="${SERIES_COL[i % 4]}"/><text x="${cx + 9}" y="${cy + 4}" font-size="10" fill="var(--ink)">${esc(trunc(it.label || "", 26))}</text>`;

  }

      g += `<rect x="130" y="${y + 4}" width="${w}" height="${rowH - 10}" rx="5" fill="${val === null ? "none" : "var(--qu)"}" stroke="${val === null ? "var(--muted)" : "none"}" stroke-dasharray="${val === null ? "4 3" : "0"}" opacity="${val === null ? 1 : 0.85 - i * 0.08}"/>`;
      g += `<text x="${130 + w + 6}" y="${y + rowH / 2 + 4}" font-size="11" fill="var(--muted)">${val === null ? "?" : fmtN(val) + (v.unit ? " " + esc(v.unit) : "")}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${Math.max(H, steps.length * rowH + 8)}" role="img" aria-label="${esc(v.title || "Funnel")}">${g}</svg>`;
  }
  // line or bar
  const series = (v.series || []).slice(0, 4), xs = series[0] ? series[0].points.map((p) => p.x) : [];
  const vals = series.flatMap((s) => s.points.map((p) => num(p.y))).filter((x) => x !== null);
  const L = 40, R = 10, T = 12, B = 26, pw = W - L - R, ph = H - T - B;
  const max = vals.length ? Math.max(...vals) * 1.12 : 1, min = 0;
  const X = (i) => L + (xs.length <= 1 ? pw / 2 : (t === "bar" ? (i + 0.5) * pw / xs.length : i * pw / (xs.length - 1)));
  const Y = (y) => T + ph - (y - min) / (max - min) * ph;
  let g = "";
  for (let k = 0; k <= 3; k++) { const yy = T + ph * k / 3; g += `<line x1="${L}" y1="${yy}" x2="${W - R}" y2="${yy}" stroke="var(--line)"/>`; if (vals.length) g += `<text x="${L - 6}" y="${yy + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtN(max - (max - min) * k / 3)}</text>`; }
  xs.forEach((x, i) => { g += `<text x="${X(i)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(trunc(String(x), 10))}</text>`; });
  if (t === "bar") {
    const bw = Math.min(46, pw / Math.max(1, xs.length) / Math.max(1, series.length) * 0.7);

      else g += `<rect x="${x}" y="${Y(y)}" width="${bw - 3}" height="${T + ph - Y(y)}" rx="4" fill="${SERIES_COL[si]}" opacity=".85"/><text x="${x + (bw - 3) / 2}" y="${Y(y) - 4}" font-size="10" text-anchor="middle" fill="var(--ink)">${fmtN(y)}</text>`;
    }));
  } else {
    series.forEach((sr, si) => {
      const pts = sr.points.map((pt, i) => [X(i), num(pt.y)]);
      if (pts.every(([, y]) => y === null)) {
        const yb = T + ph * (0.55 - si * 0.18);
        g += `<line x1="${L}" y1="${yb + 18}" x2="${W - R}" y2="${yb - 10}" stroke="${SERIES_COL[si]}" stroke-dasharray="5 4" opacity=".55"/>`;
        pts.forEach(([x], i) => { const yy = yb + 18 - (28 * i / Math.max(1, pts.length - 1)); g += `<circle cx="${x}" cy="${yy}" r="7" fill="var(--surface)" stroke="${SERIES_COL[si]}" stroke-dasharray="2 2"/><text x="${x}" y="${yy + 4}" font-size="9" text-anchor="middle" fill="${SERIES_COL[si]}">?</text>`; });
      } else {
        let d = ""; pts.forEach(([x, y]) => { if (y !== null) d += (d ? "L" : "M") + x + " " + Y(y); });
        g += `<path d="${d}" fill="none" stroke="${SERIES_COL[si]}" stroke-width="2.2"${sr.name && /low|high/i.test(sr.name) ? ' stroke-dasharray="5 4"' : ""}/>`;
        pts.forEach(([x, y]) => { g += y === null ? `<text x="${x}" y="${T + ph / 2}" font-size="12" text-anchor="middle" fill="var(--muted)">?</text>` : `<circle cx="${x}" cy="${Y(y)}" r="3.5" fill="${SERIES_COL[si]}"/>`; });
      }
    });
  }
  const legend = series.length > 1 ? `<div class="legend">${series.map((sr, i) => `<span><i style="background:${SERIES_COL[i]}"></i>${esc(sr.name || "Series " + (i + 1))}</span>`).join("")}</div>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(v.title || "Chart")}">${g}</svg>${legend}`;
}
function visualBlock(v, editId) {
  const [bl, bc] = BASIS[v.basis] || BASIS.placeholder;
  const editable = editId && (v.type === "line" || v.type === "bar" || v.type === "funnel");
  let editor = "";
  if (editable && v.editing) {
    if (v.type === "funnel") editor = `<div class="vedit">${(v.steps || []).map((st, i) => `<label>${esc(st.label)}<input inputmode="decimal" data-vedit="${editId}|s|${i}" value="${num(st.value) ?? ""}" placeholder="?"></label>`).join("")}</div>`;
    else editor = `<div class="vedit grid">${(v.series || []).map((sr, si) => `<div class="vrow"><b>${esc(sr.name || "Value")}</b>${sr.points.map((pt, pi) => `<label>${esc(pt.x)}<input inputmode="decimal" data-vedit="${editId}|${si}|${pi}" value="${num(pt.y) ?? ""}" placeholder="?"></label>`).join("")}</div>`).join("")}</div>`;
  }

    <div class="viz-body">${chartSVG(v)}</div>

function sanitizeVisual(raw, title) {
  if (!raw || typeof raw !== "object") return null;

  const v = { type, title: String(title || raw.title || "Chart"), unit: String(raw.unit || ""), basis: ["user", "placeholder", "estimate", "definition"].includes(raw.basis) ? raw.basis : "placeholder", source: String(raw.source || ""), note: String(raw.note || "") };
  if (type === "matrix") v.items = (Array.isArray(raw.items) ? raw.items : []).slice(0, 8).map((it) => ({ label: String(it.label || ""), impact: num(it.impact) || 3, evidence: num(it.evidence) || 1 }));
  else if (type === "funnel") v.steps = (Array.isArray(raw.steps) ? raw.steps : []).slice(0, 6).map((st) => ({ label: String(st.label || ""), value: num(st.value) }));

}

// =================== Guided mode: answer what was asked ===================
const NUM_PAIR_RE = /([A-Za-z0-9][A-Za-z0-9 .'&\/-]{0,28}?)\s*(?::|=|-|–|—|\bis\b|\bwas\b)\s*\$?\s*(\d+(?:[.,]\d+)?)\s*(%|k|m|bn|b|million|billion)?/gi;
function parseFigures(text) {
  const out = []; let m;
  while ((m = NUM_PAIR_RE.exec(text))) {
    const x = m[1].trim().replace(/^(and|in|for|of)\s+/i, ""), y = Number(m[2].replace(",", "."));
    const isYearLabel = /^(19|20)\d\d$/.test(m[2]) && !m[3] && text.slice(NUM_PAIR_RE.lastIndex).trim().startsWith(":");
    if (isYearLabel) { NUM_PAIR_RE.lastIndex -= m[2].length + 1; continue; } // "report: 2025: 12" — 2025 is the next label

function intentOf(t) {
  t = t.toLowerCase();
  if (/\b(market|forecast|projection|predict|tam|sam|som|market size|trend|growth rate|chart|graph|visual|visuali[sz]e|plot|competitor|share|funnel|matrix)\b/.test(t)) return "visual";
  if (/\b(what'?s missing|missing|gaps?|review)\b/.test(t)) return "gaps";
  if (/\b(pitch|vp|present|presentation|stakeholder|exec|leadership|sell (it|this))\b/.test(t)) return "pitch";
  if (/\b(risks?|could go wrong|trade-?offs?|downside|worry)\b/.test(t)) return "risks";
  if (/\b(summari[sz]e|summary|where are we|status)\b/.test(t)) return "summary";
  if (/\?\s*$/.test(t) || /^(how|what|why|which|should|can|could|do|does|is|are)\b/.test(t)) return "help";

const first = (f, k) => (items(f, k)[0] || {}).text;
function visualReply(f, text) {
  const props = [], low = text.toLowerCase();

    const timey = figs.every((p) => /^((19|20)\d\d|q[1-4]|h[12]|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|month|week)/i.test(p.x));

  } else {

      props.push({ kind: "visual", text: "Forecast: low, base and high scenarios", visual: { type: "line", basis: "placeholder", note: "Agree the scenario assumptions before anyone fills in numbers.", series: ["Low", "Base", "High"].map((n) => ({ name: n, points: [0, 1, 2, 3].map((i) => ({ x: String(year + i), y: null })) })) } });
    if (/market|tam|sam|som|size/.test(low))
      props.push({ kind: "visual", text: "Market size: total, serviceable, obtainable", visual: { type: "bar", basis: "placeholder", series: [{ name: "Size", points: [{ x: "TAM", y: null }, { x: "SAM", y: null }, { x: "SOM", y: null }] }] } });
    if (/competitor|share/.test(low))
      props.push({ kind: "visual", text: "Competitor comparison", visual: { type: "bar", basis: "placeholder", series: [{ name: "Share", points: [{ x: "Us", y: null }, { x: "Competitor A", y: null }, { x: "Competitor B", y: null }] }] } });

}
function intentReply(f, intent, text) {
  if (intent === "visual") return visualReply(f, text);
  if (intent === "gaps") { const g = gaps(f).slice(0, 5); return { text: g.length ? "Here's what's missing, most important first:\n" + g.map((x, i) => `${i + 1}. ${x.text}`).join("\n") : "Nothing is missing that I can count. Ask each role to agree their sections." }; }
  if (intent === "pitch") return { text: `A pitch from what's in the definition:\n1. Problem: ${first(f, "problem") || "[unknown]"}\n2. Evidence: ${first(f, "evidence") || "[unknown]"}\n3. The bet (untested): ${first(f, "assumption") || "[unknown]"}\n4. The ask: agree v1 = ${first(f, "scope_in") || "[unknown]"}, measured by ${first(f, "measure") || "[unknown]"} with baseline [unknown].\nLead with the problem, not the feature.` };

    const props = sentences(userText).map((s) => ({ kind: classifySentence(s, false), text: s }));
    const ev = props.filter((x) => x.kind === "evidence").length;
    msg.text = `I split your request into ${props.length} claim${props.length === 1 ? "" : "s"}. ${ev ? `${ev} name${ev === 1 ? "s" : ""} a source, so I've marked ${ev === 1 ? "it" : "them"} as evidence. The rest stay assumptions until someone finds a source.` : "None of them names a source yet, so they stay assumptions until someone finds one."}`;

const RULES = `You are the assistant inside Scopeline, a chat where a product team (PM, design, growth, engineering) agrees one feature's definition before building it. You lead the conversation one step at a time: context and problem, audience and outcome, claims (evidence vs assumptions), scope in and out, measures, then review.
Rules:
0. First respond to what the user actually said. If they asked a question, answer it directly before anything else; do not ignore it to follow the script.
1. You ask and propose; people decide. "reply" is at most two plain sentences, unless the user asks for advice (framing, pitching, risks, trade-offs): then coach in up to six short lines using only facts in the definition, writing [unknown] where a fact is missing.
2. Never invent numbers, percentages, dates, baselines, targets or audience sizes. Use placeholders like [baseline] and ask the right role.
3. Use kind "evidence" ONLY to restate something from the user's own messages or pasted notes that names its source; put the source in "source". Anything else is an "assumption".
4. Never repeat items already in the definition.
5. Ask exactly one follow-up question for the next missing step, for one role, with 2 to 4 short answer options when sensible.
6. At most 5 proposals. Kinds: problem, audience, outcome, evidence, assumption, question, scope_in, scope_out, criterion, measure, decision.
7. Never state that the feature will cause an outcome; expected impact is an assumption.
8. Visuals: when the user asks for market research, a forecast, sizing, a comparison or a chart, or when a chart would make a decision clearer, add a proposal with kind "visual", a short title in "text", and a "visual" object: {"type": "line"|"bar"|"matrix"|"funnel", "unit": string, "series": [{"name": string, "points": [{"x": string, "y": number|null}]}], "items": [{"label": string, "impact": 1|2|3, "evidence": 1|2|3}], "steps": [{"label": string, "value": number|null}], "basis": "user"|"placeholder"|"estimate"|"definition", "source": string, "note": string}. Use "series" for line and bar, "items" for matrix (assumptions by impact and evidence), "steps" for funnel. Numbers the user gave: basis "user". No data: null values with basis "placeholder" (forecasts as Low/Base/High series). You cannot browse the web. Only if the user explicitly asks for market estimates may you give rough figures from your training knowledge, with basis "estimate", what they are based on in "source", and a reply that says they must be verified before use.
Return ONLY JSON: {"reply": string, "questions": [{"text": string, "role": "pm"|"design"|"growth"|"engineering", "options": [string]}], "proposals": [{"kind": string, "text": string, "source": string, "role": string, "why": string, "visual": object}]}`;
function snapshot(f) {
  const by = (k) => items(f, k).map((x) => x.text);

    questions: (Array.isArray(out.questions) ? out.questions : []).slice(0, 2).filter((q) => q && q.text).map((q) => ({ id: uid(), text: String(q.text), role: ROLES[q.role] ? q.role : "pm", options: (Array.isArray(q.options) ? q.options : []).slice(0, 4).map(String) })),

    const done = ks.every((k) => items(f, k).length);
    return `<span class="${done ? "done" : i === nowIdx ? "now" : ""}">${done ? "✓" : i + 1} ${name}</span>`;
  }).join("")}</div>`;
}

function aiMsg(f, m) {
  const qs = (m.questions || []).map((q) => `<div class="qcard"><span><span class="tag t-qu">Question · ${ROLES[q.role] || "PM"}</span></span><b>${esc(q.text)}</b>
    ${q.options && q.options.length ? `<div class="opts">${q.options.map((o, i) => `<button class="opt ${q.answer === o ? "on" : ""}" data-ans="${m.id}|${q.id}|${i}" ${q.answer ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>` : `<span class="muted" style="font-size:.82rem">Answer in the message box.</span>`}</div>`).join("");
  const open = (m.proposals || []).filter((p) => p.status === "open");
  const ps = (m.proposals || []).map((p) => {
    const [label, co] = KIND[p.kind];
    const bad = p.status === "open" ? unsourced(f, p.text) : [];
    let body = esc(p.text); bad.forEach((n) => { body = body.replace(esc(n), `<mark class="bad">${esc(n)}</mark>`); });
    if (p.kind === "visual") {
      if (p.status !== "open") return `<div class="pcard vcard done"><div class="txt"><span class="co-tag">Visual · ${esc(p.text)}</span></div><span class="acts">${p.status === "accepted" ? "Added to Visuals" : "Dismissed"}</span></div>`;
      return `<div class="pcard vcard"><div class="txt">${visualBlock(p.visual, `${m.id}|${p.id}`)}</div><span class="acts"><button class="yes" data-p="${m.id}|${p.id}|yes">Add to definition</button><button data-p="${m.id}|${p.id}|no" aria-label="Dismiss">✕</button></span></div>`;
    }
    if (p.status !== "open") return `<div class="pcard callout ${co} done"><div class="txt"><span class="co-tag">${label}</span>${esc(p.text)}</div><span class="acts">${p.status === "accepted" ? "Added" : "Dismissed"}</span></div>`;
    return `<div class="pcard callout ${co}"><div class="txt"><span class="co-tag">${label}${p.source ? ` · ${esc(p.source)}` : ""}${p.kind === "question" ? ` · ${ROLES[p.role] || "PM"}` : ""}</span>
      ${p.editing ? `<textarea id="ed-${p.id}" rows="2">${esc(p.text)}</textarea>` : body}${p.why ? `<span class="why">${esc(p.why)}</span>` : ""}</div>
      <span class="acts">${p.editing ? `<button class="yes" data-p="${m.id}|${p.id}|save">Save</button>` : `<button class="yes" data-p="${m.id}|${p.id}|yes">Accept</button><button data-p="${m.id}|${p.id}|edit">Edit</button>`}<button data-p="${m.id}|${p.id}|no" aria-label="Dismiss">✕</button></span>
      ${bad.length ? `<span class="flag">${bad.map(esc).join(", ")} isn't in anything you've shared. Edit it to a placeholder like [target], or paste the source.</span>` : ""}</div>`;
  }).join("");
  const applied = (m.proposals || []).filter((p) => p.status === "accepted").length;
  return `<div class="m-ai"><span class="who"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Scopeline</span>
    ${m.text ? `<p class="reply">${esc(m.text)}</p>` : ""}
    ${ps ? `<div class="props"><div class="props-head"><span>${applied} of ${m.proposals.length} added</span>${open.length > 1 ? `<button class="link" data-acceptall="${m.id}">Accept all ${open.length}</button>` : ""}</div>${ps}</div>` : ""}
    ${qs}</div>`;
}

function docPane(f) {
  const total = SECTIONS.length, agreed = SECTIONS.filter(([k]) => secStatus(f, k) === "agreed").length, filledN = SECTIONS.filter(([k]) => items(f, k).length).length;
  const g = gaps(f);
  return `<aside class="docpane" aria-label="Definition">
    <div class="doc-top"><h2>Definition</h2><span class="mono">${filledN} of ${total} filled · ${agreed} agreed</span></div>
    <div class="ready"><div class="meter"><span style="width:${Math.round(filledN / total * 100)}%"></span></div>
      <div class="gapline"><span>${g.length ? `${g.length} gap${g.length === 1 ? "" : "s"} counted from the definition` : "No gaps Scopeline can count"}</span>${g.length ? `<button class="link" data-say="What's missing from the definition? Ask me about the most important gap.">Ask about gaps</button>` : ""}</div></div>
    ${SECTIONS.filter(([k]) => items(f, k).length).map(([k, label]) => {
      const list = items(f, k), st = secStatus(f, k), co = KIND[k][1];
      return `<div class="dsec"><div class="dsec-h"><h3>${label} <span class="st ${st}">${st}</span></h3>${list.length ? `<button class="agree ${st === "agreed" ? "on" : ""}" data-agree="${k}">${st === "agreed" ? "✓ Agreed" : "Agree"}</button>` : ""}</div>
        ${k === "visual" ? list.map((x) => `<div class="ditem vitem">${visualBlock(x.visual, `doc|${x.id}`)}<button class="x" data-del="${x.id}" aria-label="Remove">✕</button></div>`).join("") : list.length ? list.map((x) => { const nums = ["assumption", "measure", "outcome", "problem", "scope_in", "decision"].includes(k) ? unsourced(f, x.text) : []; let t = esc(x.text); nums.forEach((n) => { t = t.replace(esc(n), `<mark class="bad" title="No source">${esc(n)}</mark>`); }); return `<div class="ditem callout ${co}"><span>${t}${x.source ? `<span class="co-src">${esc(x.source)}</span>` : ""}${k === "question" ? `<span class="co-src">${ROLES[x.role] || "PM"}${x.answer ? ` · answered: ${esc(x.answer)}` : " · unanswered"}</span>` : ""}${k === "measure" ? `<span class="co-src">Baseline ${x.baseline ? esc(x.baseline) : '<span class="ph">unknown</span>'}</span>` : ""}${k === "assumption" ? `<span class="co-src">${x.owner ? "Owner: " + esc(x.owner) : "No owner or test yet"}</span>` : ""}</span>${nums.length ? `<span class="co-src" style="color:var(--bad)">${nums.map(esc).join(", ")} has no source</span>` : ""}</span><button class="x" data-del="${x.id}" aria-label="Remove">✕</button></div>`; }).join("") : `<p class="dempty">Empty</p>`}
      </div>`;
    }).join("") || `<p class="dempty">Accepted items appear here, grouped by section.</p>`}
    ${SECTIONS.some(([k]) => !items(f, k).length) ? `<div class="dsec"><h3 style="font-size:.86rem">Still to cover</h3><div class="chips">${SECTIONS.filter(([k]) => !items(f, k).length).map(([k, l]) => `<button class="chip" data-say="Let's cover ${l.toLowerCase()} next. Ask me what you need.">${l}</button>`).join("")}</div></div>` : ""}
  </aside>`;
}

// =================== Demo animation ===================
let demoTimers = [], demoObserver = null, chapter = 0, vPlaying = true, vScene = -1, vVisible = false;
const SCENES = [6200, 5200, 4600, 5600, 4800];
const REQ = "We want one-tap reorder to increase repeat purchases by 40%. Support tickets show customers rebuild baskets by hand.";
const reduceMo = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function vAt(ms, fn) { demoTimers.push(setTimeout(fn, ms)); }
function vCamera(target, scale) {
  const cam = document.getElementById("cam"), pl = document.getElementById("player"); if (!cam) return;
  document.querySelectorAll("#player .zone").forEach((z) => z.classList.toggle("focus", z.id === target));
  if (!target || reduceMo() || pl.clientWidth < 700) { cam.style.transform = "none"; cam.classList.remove("zoom"); return; }
  const z = document.getElementById(target);
  const W = pl.clientWidth, H = pl.clientHeight;
  const cx = z.offsetLeft + z.offsetWidth / 2, cy = z.offsetTop + 34 + z.offsetHeight / 2;
  const tx = W / 2 - cx * scale, ty = H / 2 - cy * scale;
  cam.style.transform = `translate(${Math.min(0, Math.max(W - W * scale, tx))}px, ${Math.min(0, Math.max(H - H * scale, ty))}px) scale(${scale})`;
  cam.classList.add("zoom");
}
function vCursorTo(el, click) {
  const c = document.getElementById("v-cursor"), pl = document.getElementById("player"); if (!c || !el) return;
  const r = el.getBoundingClientRect(), p = pl.getBoundingClientRect();
  c.style.left = (r.left - p.left + r.width * 0.6) + "px"; c.style.top = (r.top - p.top + r.height * 0.55) + "px";
  if (click) vAt(1050, () => { c.classList.remove("click"); void c.getBoundingClientRect(); c.classList.add("click"); });
}
function vState(n) {
  // Deterministic state for the start of scene n: everything from earlier scenes is visible.
  const pl = document.getElementById("player"); if (!pl) return;
  pl.querySelectorAll("[data-s]").forEach((el) => el.classList.toggle("hide", Number(el.dataset.s) > n));
  document.getElementById("v-start").classList.toggle("gone", n > 0);
  document.getElementById("v-typed").textContent = n > 0 ? REQ : "";
  document.getElementById("v-opt").classList.toggle("on", n > 1);
  document.getElementById("v-fix").classList.toggle("fixed", n > 3);
  document.getElementById("v-use").style.display = n > 3 ? "none" : "";
  document.getElementById("v-q").classList.toggle("glowb", n === 1);
  document.getElementById("v-fix").classList.toggle("glowb", n === 3);
  pl.classList.toggle("agreed", n >= 4);
  const agreed = [0, 0, 3, 6, 11][n];
  document.getElementById("v-count").textContent = `${agreed} of 11 agreed`;
  document.getElementById("v-meter").style.width = Math.round(agreed / 11 * 100) + "%";
  document.querySelectorAll(".seg2").forEach((sg) => { const k = Number(sg.dataset.scene); sg.classList.toggle("on", k === n); sg.classList.toggle("done", k < n); const i = sg.querySelector("i"); i.style.transition = "none"; i.style.width = k < n ? "100%" : "0"; });
}
function vScenePlay(n) {
  demoTimers.forEach(clearTimeout); demoTimers = [];
  vScene = n; chapter = n + 1; vState(n);
  const bar = document.querySelector(`.seg2[data-scene="${n}"] i`);
  if (vPlaying && !reduceMo()) { void bar.offsetWidth; bar.style.transition = `width ${SCENES[n]}ms linear`; bar.style.width = "100%"; }
  if (reduceMo()) { vState(4); vCamera(null); return; }
  const typed = document.getElementById("v-typed");
  if (n === 0) {
    vCamera("v-start", 1.0);
    let i = 0; const tick = () => { if (!vPlaying) return; typed.textContent = REQ.slice(0, i); i += 2; if (i <= REQ.length + 1) vAt(38, tick); };
    vAt(500, tick);
    vCursorTo(document.getElementById("v-send"), true);
    vAt(5400, () => { document.getElementById("v-start").classList.add("gone"); });
  }

  if (n === 2) { vCamera("v-doc", 1.35); const els = [...document.querySelectorAll('#v-doc [data-s="2"]')]; els.forEach((e) => e.classList.add("hide")); els.forEach((e, i) => vAt(900 + i * 650, () => { e.classList.remove("hide"); document.getElementById("v-count").textContent = `${i + 1} of 11 agreed`; document.getElementById("v-meter").style.width = Math.round((i + 1) / 11 * 100) + "%"; })); }
  if (n === 3) { vCamera("v-doc", 1.45); vAt(1500, () => vCursorTo(document.getElementById("v-use"), true)); vAt(2700, () => { document.getElementById("v-fix").classList.add("fixed"); document.getElementById("v-use").style.display = "none"; }); }
  if (n === 4) { vCamera(null); vAt(600, () => { document.getElementById("player").classList.add("agreed"); }); const c = document.getElementById("v-cursor"); c.style.left = "92%"; c.style.top = "92%"; }
  if (vPlaying) vAt(SCENES[n], () => vScenePlay((n + 1) % SCENES.length));

function playDemo() { vPlaying = true; setPlayIcon(); vScenePlay(0); }
function setPlayIcon() { const b = document.getElementById("v-play"); if (b) { b.textContent = vPlaying ? "❚❚" : "▶"; b.setAttribute("aria-label", vPlaying ? "Pause" : "Play"); } }
function showChapter(n) { vScenePlay(Math.max(0, n - 1)); }
function initLanding() {

  demoObserver = new IntersectionObserver((es) => es.forEach((e) => {
    vVisible = e.isIntersecting;
    if (e.isIntersecting && vScene < 0 && vPlaying) vScenePlay(0);
    if (!e.isIntersecting) { demoTimers.forEach(clearTimeout); vScene = -1; }
  }), { threshold: 0.3 });
  demoObserver.observe(pl);
  document.getElementById("v-play").addEventListener("click", () => { vPlaying = !vPlaying; setPlayIcon(); if (vPlaying) vScenePlay(Math.max(0, vScene)); else { demoTimers.forEach(clearTimeout); const i = document.querySelector(`.seg2[data-scene="${vScene}"] i`); if (i) { const w = getComputedStyle(i).width; i.style.transition = "none"; i.style.width = w; } } });
  document.querySelectorAll(".seg2").forEach((sg) => sg.addEventListener("click", () => { vPlaying = true; setPlayIcon(); vScenePlay(Number(sg.dataset.scene)); }));
  // Problem / Solution
  const psTabs = document.querySelectorAll("[data-ps]");

    solution: ["One definition, every role signed off", "The same conversation holds the evidence, the open questions and each role's answers. What's agreed is recorded with who agreed and why."] };
  psTabs.forEach((t) => t.addEventListener("click", () => {

    document.querySelectorAll(".pspanel").forEach((p) => { p.hidden = p.dataset.panel !== t.dataset.ps; });
    document.getElementById("ps-title").textContent = PS[t.dataset.ps][0]; document.getElementById("ps-sub").textContent = PS[t.dataset.ps][1];
    if (t.dataset.ps === "solution") document.querySelectorAll(".bcard").forEach((c, i) => { c.classList.remove("in"); setTimeout(() => c.classList.add("in"), reduceMo() ? 0 : 200 + i * 220); });
  }));
  document.querySelectorAll(".bcard").forEach((c) => c.classList.add("in"));
  // Gaps
  const lis = [...document.querySelectorAll("#gapcard .glist li")];
  const upd = () => { const open = lis.filter((l) => !l.classList.contains("fixed")).length; const ready = 11 - open;
    document.getElementById("gapmeter").style.width = Math.round(ready / 11 * 100) + "%"; document.getElementById("gaptext").textContent = `${ready} of 11 sections ready`;
    const b = document.getElementById("gapbadge"); b.textContent = open ? `${open} open` : "None open"; b.classList.toggle("ok", !open); document.getElementById("gapready").hidden = open > 0; };
  lis.forEach((li) => li.querySelector("[data-gfix]").addEventListener("click", (ev) => { li.classList.add("fixed"); ev.currentTarget.textContent = "Fixed"; upd(); }));
  // Roles
  const RQ = { design: [["What if an item is out of stock?", ["Hide it", "Show it, excluded from total"]], ["Where does reorder start?", ["Order history", "Home screen"]]],
    growth: [["Do we have a repeat-order baseline?", ["Yes, in analytics", "No, needs instrumentation"]], ["How will we know it worked?", ["Holdout test", "Before-and-after only"]]],
    engineering: [["When are prices re-checked?", ["When the basket is rebuilt", "At payment"]], ["Any dependency on another team?", ["Catalogue variants", "None"]]],
    pm: [["Who is v1 for?", ["Customers with 2+ orders", "Everyone"]], ["What does v1 leave out?", ["Scheduled reorders", "Editing past orders"]]] };
  let role = "design", qi = 0;
  const drawRole = () => {
    document.querySelectorAll("#rolecard .rsec").forEach((x) => x.classList.toggle("lit", x.dataset.for.split(" ").includes(role)));
    document.getElementById("rtitle").textContent = ROLES[role];

    if (qi >= RQ[role].length) { document.getElementById("rstep").textContent = "Done"; document.getElementById("rq").textContent = ""; box.innerHTML = `<div class="res-done">${ROLES[role]}'s answers are saved as decisions with reasons.</div>`; return; }
    const [q, o] = RQ[role][qi]; document.getElementById("rstep").textContent = `${qi + 1} / ${RQ[role].length}`; document.getElementById("rq").textContent = q;
    box.innerHTML = o.map((x) => `<button class="opt" type="button">${esc(x)}</button>`).join("");
    box.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { b.classList.add("on"); setTimeout(() => { qi++; drawRole(); }, 380); }));
  };

function afterRender() {
  if (state.view === "home") initLanding(); else if (demoObserver) { demoObserver.disconnect(); demoTimers.forEach(clearTimeout); chapter = 0; }
  document.querySelectorAll(".composer textarea").forEach((t) => {
    const fit = () => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; };
    t.addEventListener("input", fit);
    t.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); t.form.requestSubmit(); } });
  });
  if (state.view === "new") document.getElementById("start-in")?.focus();
}
function scrollThread() { const t = document.getElementById("thread"); if (t && t.lastElementChild) t.lastElementChild.scrollIntoView({ block: "end", behavior: "smooth" }); }

// =================== Events ===================
document.addEventListener("submit", (e) => {
  const form = e.target.closest("form[data-form]"); if (!form) return; e.preventDefault();
  const text = form.querySelector("textarea").value.trim(); if (!text) return;
  if (form.dataset.form.startsWith("start")) return startChat(text);
  form.querySelector("textarea").value = ""; respond(cur(), text);
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, a"); if (!el) return;
  const f = cur();
  if (el.dataset.act === "home") { state.view = "home"; save(); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.act === "new") { state.view = "new"; save(); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.act === "stop") { ctl?.abort(); return; }
  if (el.dataset.fill) { const t = el.closest("form").querySelector("textarea"); t.value = EXAMPLES[el.dataset.fill]; t.focus(); t.dispatchEvent(new Event("input")); return; }
  if (el.dataset.try) return startChat(EXAMPLES[el.dataset.try]);
  if (el.dataset.open) { state.current = el.dataset.open; state.view = "chat"; save(); render(); scrollThread(); return; }
  if (el.dataset.tab) { mobileTab = el.dataset.tab; render(); return; }
  if (!f) return;
  if (el.dataset.say) { if (!busy) respond(f, el.dataset.say); return; }
  if (el.dataset.ans) {
    const [mid, qid, i] = el.dataset.ans.split("|"); const m = f.chat.find((x) => x.id === mid); const q = m.questions.find((x) => x.id === qid);
    q.answer = q.options[Number(i)];
    if (m.guideKey && aiState !== "ready") { save(); return respond(f, q.answer); }
    f.doc.push({ id: uid(), kind: "question", text: q.text, role: q.role, answer: q.answer, source: "", owner: "", baseline: "" });
    save(); return respond(f, `${ROLES[q.role]} answer: ${q.answer}`);
  }
  if (el.dataset.acceptall) { const m = f.chat.find((x) => x.id === el.dataset.acceptall); m.proposals.filter((p) => p.status === "open").forEach((p) => accept(f, p)); save(); render(); return toast("Added to the definition"); }
  if (el.dataset.p) {
    const [mid, pid, act] = el.dataset.p.split("|"); const m = f.chat.find((x) => x.id === mid); const p = m.proposals.find((x) => x.id === pid);
    if (act === "edit") { p.editing = true; render(); document.getElementById("ed-" + p.id)?.focus(); return; }
    if (act === "save") { const v = document.getElementById("ed-" + p.id)?.value.trim(); if (v) p.text = v; p.editing = false; accept(f, p); }
    if (act === "yes") accept(f, p);
    if (act === "no") p.status = "dismissed";
    save(); render(); if (act !== "no") { toast(`Added to ${SEC_LABEL[p.kind].toLowerCase()}`); if (mobileTab === "chat") {} } return;
  }
  if (el.dataset.vtoggle) { const v = findVisual(f, el.dataset.vtoggle); if (v) { v.editing = !v.editing; if (!v.editing) save(); render(); } return; }
  if (el.dataset.agree) { const k = el.dataset.agree; f.agreed[k] = !f.agreed[k]; save(); render(); return toast(f.agreed[k] ? `${SEC_LABEL[k]} agreed` : `${SEC_LABEL[k]} reopened`); }
  if (el.dataset.del) { f.doc = f.doc.filter((x) => x.id !== el.dataset.del); save(); render(); return; }
  if (el.dataset.act === "copy") {
    const md = `# ${f.title}\n\n> ${f.request}\n\n` + SECTIONS.map(([k, l]) => `## ${l}${f.agreed[k] ? " (agreed)" : ""}\n` + (items(f, k).map((x) => `- ${x.text}${x.source ? ` _(source: ${x.source})_` : ""}${k === "measure" ? ` — baseline: ${x.baseline || "unknown"}` : ""}${k === "question" ? ` — ${ROLES[x.role] || "PM"}${x.answer ? `: ${x.answer}` : ", unanswered"}` : ""}`).join("\n") || "- _empty_")).join("\n\n");
    const done = () => toast("Summary copied");

  }
});
function findVisual(f, key) {
  const [a, b] = key.split("|");
  if (a === "doc") return (f.doc.find((x) => x.id === b) || {}).visual;
  const m = f.chat.find((x) => x.id === a); return m && ((m.proposals || []).find((x) => x.id === b) || {}).visual;
}
document.addEventListener("change", (e) => {
  const inp = e.target.closest("input[data-vedit]"); if (!inp) return;
  const f = cur(); if (!f) return;
  const parts = inp.dataset.vedit.split("|"), key = parts[0] + "|" + parts[1], v = findVisual(f, key); if (!v) return;
  const val = inp.value.trim() === "" ? null : Number(inp.value.replace(",", "."));
  if (parts[2] === "s") v.steps[Number(parts[3])].value = isNaN(val) ? null : val;
  else v.series[Number(parts[2])].points[Number(parts[3])].y = isNaN(val) ? null : val;
  if (v.basis === "placeholder") { v.basis = "user"; v.source = v.source || "Entered by you"; }
  save(); render();
  const again = document.querySelector(`input[data-vedit="${inp.dataset.vedit}"]`); again?.focus();
});
function fallbackCopy(md) {
  const t = document.createElement("textarea"); t.value = md; t.style.position = "fixed"; t.style.top = "10px"; t.style.left = "10px"; t.style.width = "80vw"; t.style.height = "40vh"; t.style.zIndex = 70;
  document.body.appendChild(t); t.select(); toast("Select all and copy, then click anywhere to close");
  setTimeout(() => document.addEventListener("click", () => t.remove(), { once: true }), 50);
}
render();
})();
